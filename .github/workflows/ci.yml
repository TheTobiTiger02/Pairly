name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build Pairly.sln --configuration Release
      - name: Test harness
        run: dotnet run --project tests/Pairly.Tests/Pairly.Tests.csproj --configuration Release --no-build
      - name: Render every page (fails on broken XAML)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifacts/windows-screenshots'
          $exe = 'src/windows/Pairly.Windows/bin/Release/net9.0-windows10.0.19041.0/Pairly.Windows.exe'
          $process = Start-Process $exe -ArgumentList '--render-screenshots', "`"$out`"" -PassThru
          if (-not $process.WaitForExit(600000)) { $process.Kill(); throw 'Rendering timed out.' }
          $result = Join-Path $out 'result.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($process.ExitCode -ne 0) { throw "Rendering failed with exit code $($process.ExitCode)." }
          Get-ChildItem $out -Filter *.png | Measure-Object | ForEach-Object { "Rendered $($_.Count) screenshots." }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: artifacts/windows-screenshots
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit test and render screenshots
        # recordRoborazziDebug runs every unit test and renders each screen in every design
        # variant, light and dark, English and German.
        run: ./gradlew :app:assembleDebug :app:recordRoborazziDebug :server:assembleRelease :app:lintVitalRelease
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: src/android/app/build/outputs/roborazzi
          if-no-files-found: ignore
