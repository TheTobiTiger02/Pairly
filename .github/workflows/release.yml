name: Release

# Push a tag like v1.2.3 to build and publish both apps. Windows goes to the Microsoft Store, which
# signs and updates it; Android is attached to the GitHub release and updates through its in-app updater.
#
# Repository variables (public Partner Center identity): STORE_IDENTITY_NAME, STORE_PUBLISHER,
# STORE_PUBLISHER_DISPLAY_NAME, STORE_DISPLAY_NAME, STORE_PRODUCT_ID.
# Secrets: Android signing. Optional, for automatic Store submission: STORE_TENANT_ID,
# STORE_SELLER_ID, STORE_CLIENT_ID, STORE_CLIENT_SECRET. Without them, upload the -store-msix
# artifact to Partner Center by hand (see docs/private-release.md).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
      STORE_API_CONFIGURED: ${{ secrets.STORE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Derive versions from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Tag '$tag' must look like v1.2.3." }
          $major = [int] $Matches[1]; $minor = [int] $Matches[2]; $patch = [int] $Matches[3]
          if ($minor -gt 99 -or $patch -gt 99) { throw 'Minor and patch must be below 100 for the Android versionCode.' }
          "name=$major.$minor.$patch" >> $env:GITHUB_OUTPUT
          "package=$major.$minor.$patch.0" >> $env:GITHUB_OUTPUT
          "code=$($major * 10000 + $minor * 100 + $patch)" >> $env:GITHUB_OUTPUT

      - name: Restore Android signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes("$dir\release.p12", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_B64))
          "SL_ANDROID_KEYSTORE=$dir\release.p12" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        env:
          SL_SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Until the Partner Center identity is configured, release Android only.
          $windows = if ($env:STORE_IDENTITY_NAME) { 'Store' } else { 'None' }
          .\scripts\Build-PrivateRelease.ps1 `
            -PackageVersion '${{ steps.version.outputs.package }}' `
            -AndroidVersionName '${{ steps.version.outputs.name }}' `
            -AndroidVersionCode ${{ steps.version.outputs.code }} `
            -WindowsPackage $windows

      - name: Build Windows installer (Velopack)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install -g vpk --version 1.2.161
          $out = 'artifacts/release/velopack'
          # The previous release's package lets vpk produce a small delta update. The first
          # Velopack release has none, so a failed download is fine.
          vpk download github --repoUrl 'https://github.com/${{ github.repository }}' --token $env:GH_TOKEN --outputDir $out
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous Velopack release; building a full package only.' }
          .\scripts\Build-Velopack.ps1 -Version '${{ steps.version.outputs.name }}' -OutputDirectory $out

      - name: Keep Store package
        if: env.STORE_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: Pairly-${{ steps.version.outputs.name }}-store-msix
          path: artifacts/release/windows/Pairly.msix

      - name: Set up Microsoft Store CLI
        if: env.STORE_API_CONFIGURED == 'true' && env.STORE_PRODUCT_ID != '' && env.STORE_IDENTITY_NAME != ''
        uses: microsoft/setup-msstore-cli@v1

      - name: Submit to Microsoft Store
        if: env.STORE_API_CONFIGURED == 'true' && env.STORE_PRODUCT_ID != '' && env.STORE_IDENTITY_NAME != ''
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed with exit code $LASTEXITCODE." }
          msstore publish artifacts/release/windows/Pairly.msix -id $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed with exit code $LASTEXITCODE." }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $store = if ($env:STORE_PRODUCT_ID) {
            "Windows: [Microsoft Store](https://apps.microsoft.com/detail/$env:STORE_PRODUCT_ID) (recommended; new versions arrive after certification), or Pairly-Setup.exe below, which updates itself right away.`n`n"
          } else {
            "Windows: run Pairly-Setup.exe below; it updates itself.`n`n"
          }
          $notes = $store + "Android: install Pairly.apk; installed apps update themselves."
          # Velopack update feed: this version's packages plus the release index installed copies read.
          $version = '${{ steps.version.outputs.name }}'
          $velopack = Get-ChildItem artifacts/release/velopack -File | Where-Object {
            $_.Name -in 'Pairly-Setup.exe', 'releases.win.json', 'assets.win.json', 'RELEASES' -or
            $_.Name -like "PairlyDesktop-$version-*.nupkg"
          } | ForEach-Object { $_.FullName }
          gh release create '${{ github.ref_name }}' `
            artifacts/release/android/Pairly.apk `
            @velopack `
            --title 'Pairly ${{ steps.version.outputs.name }}' `
            --notes $notes `
            --generate-notes

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'signing') -ErrorAction SilentlyContinue
